# Activate with SPRING_PROFILES_ACTIVE=postgres (used in production with Supabase).
#
# Supabase: Project Settings > Database > Connection string > "Session pooler" (works over IPv4,
# which Render needs). Convert it to JDBC form:
#   DB_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
#   DB_USERNAME=postgres.<project-ref>
#   DB_PASSWORD=<your database password>
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/imdbee}
spring.datasource.username=${DB_USERNAME:imdbee}
spring.datasource.password=${DB_PASSWORD:imdbee}

# Supabase's free pooler allows few connections; keep the pool small
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.connection-timeout=20000

spring.h2.console.enabled=false
