spring.application.name=imdbee

# Hosting platforms like Render pass the port in $PORT
server.port=${PORT:8080}

# Reads local secrets from backend/.env (KEY=value lines). Optional: the app also starts without it.
spring.config.import=optional:file:.env[.properties]

# --- Database (default: H2 file database, no installation needed) ---
# Switch to PostgreSQL with: SPRING_PROFILES_ACTIVE=postgres (see application-postgres.properties)
spring.datasource.url=jdbc:h2:file:./data/imdbee;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JWT ---
# Override in production with the JWT_SECRET env var (min. 32 characters).
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:1440}

# --- TMDB ---
# Get a free key at https://www.themoviedb.org/settings/api (API Read Access Token or v3 key).
# Without a key the app runs in demo mode with a small built-in catalog.
app.tmdb.api-key=${TMDB_API_KEY:}
app.tmdb.base-url=https://api.themoviedb.org/3
app.tmdb.language=${TMDB_LANGUAGE:nl-NL}

# --- CORS ---
# "*" accepts requests from every origin. In production set CORS_ORIGINS to your real domain.
app.cors.allowed-origin-patterns=${CORS_ORIGINS:*}
