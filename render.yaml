# Render Blueprint: creates the IMDBee backend. In Render: New > Blueprint > pick this repo.
# Values marked "sync: false" are asked for once in the Render dashboard (they are secrets).
services:
  - type: web
    name: imdbee-api
    runtime: docker
    rootDir: backend
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: TMDB_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
